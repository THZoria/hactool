on: [push, pull_request]

jobs:
  build:
    name: hactool-${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job_name: linux
            shell: bash
          - os: windows-latest
            job_name: windows
            shell: msys2 {0}
          - os: macos-latest
            job_name: macos
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-binutils

      - name: Build
        run: |
          mv config.mk.template config.mk
          make -j2

      - name: Rename binary
        run: |
          if [ "${{ matrix.job_name }}" = "windows" ]; then
            mv hactool.exe hactool-windows.exe
          elif [ "${{ matrix.job_name }}" = "linux" ]; then
            mv hactool hactool-linux
          elif [ "${{ matrix.job_name }}" = "macos" ]; then
            mv hactool hactool-macos
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hactool-${{ matrix.job_name }}
          path: |
            hactool-windows.exe
            hactool-linux
            hactool-macos
